<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de prueba de HTML5</title>
</head>
<body>
    <h1>Formulario de prueba de HTML5</h1>
    <form action="" method="GET">
        <label for="name">Nombre:</label>
        <input name="name" type="text" required="true" maxlength="50" autofocus>
        <br/><br/>
        <label for="mail">Correo electrónico:</label>
        <input name="mail" type="email" required="true" maxlength="50">
        <br/><br/>
        <label for="url">URL:</label>
        <input name="url" type="text" maxlength="50" value="Escribe la URL de tu página web personal">
        <br/><br/>
        <label for="fechayhora">Fecha:</label></h>
        <input name="fecha" type="date"  maxlength="50"> 
        <br/><br/>
        <label for="time">Tiempo:</label></h>
        <input name="time" type="time" maxlength="50"> 
        <br/><br/>
        <label for="datetime">Fecha y hora:</label>
        <input name="datetime" type="datetime" maxlength="50">
        <br/><br/>
        <label for="mes">Mes:</label>
        <input name="mes" type="month" maxlength="50">
        <br/><br/>
        <label for="semana">Semana:</label>
        <input name="semana" type="week" maxlength="50">
        <br/><br/>
        <label for="numero">Número (min -10, max 10):</label>
        <input name="numero" type="number" min="-10" max="10">
        <br/><br/>
        <label for="tel">Teléfono:</label>
        <input name="tel" type="tel" maxlength="50">
        <br/><br/>
        <label for="searcht">Termino de búsqueda:</label>
        <input name="searcht" type="search" maxlength="50">
        <br/><br/>
        <label for="favcolor">Color favorito:</label>
        <input name="favcolor" type="color" maxlength="50">
        <br/><br/> 
        <input type="submit">
    </form>
    
</body>
</html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/2.css">
    <title>CSS Template using Grid</title>
</head>

<body>
    <h2>CSS Template using Grid</h2>
    <div class="grid-container">
        <div class="header">
            <h2>Header</h2>
        </div>
        <div class="left" style="background-color:#aaa;">Left Column</div>
        <div class="middle" style="background-color:#bbb;">MiddleColumn</div>
        <div class="right" style="background-color:#ccc;">Rigth Column</div>
        <div class="footer">
            <p>Footer</p>
        </div>
    </div>

</body>
